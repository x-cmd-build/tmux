name: build-windows

# Windows-only build. Dispatch-only (no push / pull_request triggers).
# See feedback-ci-explicit-dispatch memory.
#
# v0.2.0 strategy (option A from issue #1): build in MSYS shell with
# msys gcc (not mingw-w64). Same approach MSYS2's official tmux package
# uses. Output tmux.exe links msys-2.0.dll; package.ps1 bundles the
# DLL alongside the .exe so end-users don't need an MSYS2 install.
#
# Why not mingw-w64: tmux 3.7b is deeply POSIX-dependent
# (sys/queue.h, sys/tree.h, sys/wait.h, termios, fnmatch, etc.).
# mingw-w64 ships only a small subset; full port needs 200+ lines of
# patch. The MSYS shell + msys gcc provides a complete POSIX header
# set, the same environment MSYS2 uses to ship tmux.

# DISPATCH-ONLY: no push, no pull_request triggers. CI is run explicitly
# via `gh workflow run build-windows`.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-windows, runner: windows-latest, os: windows }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (MSYS2 + msys gcc + ncurses/libevent)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            git
            base-devel
            gcc
            autoconf
            automake
            libtool
            pkg-config
            make
            ncurses-devel
            libevent-devel

      - name: Build (Windows x86_64 — MSYS shell + msys gcc, PKGBUILD verbatim)
        shell: msys2 {0}
        run: bash scripts/build-msys2.sh && bash scripts/smoke-msys2.sh upstream/tmux/tmux.exe

      - name: Package (Windows)
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Verify self-contained (Windows)
        shell: pwsh
        run: |
          # package.ps1 puts outputs in dist/tmux-$target (matching
          # the standard ljh-sh dist layout: dist/tmux-<target>/).
          $exe = "dist/tmux-${{ matrix.target }}/bin/tmux.exe"
          if (-not (Test-Path $exe)) { throw "missing: $exe (build failed)" }
          $size = (Get-Item $exe).Length
          Write-Host "tmux.exe size: $size bytes"
          Get-ChildItem "dist/tmux-${{ matrix.target }}/bin/" | Format-Table Name, Length

      - name: Show file type & size (Windows)
        shell: pwsh
        run: |
          $exe = "dist/tmux-${{ matrix.target }}/bin/tmux.exe"
          file $exe
          Get-ChildItem "dist/tmux-${{ matrix.target }}.zip" | Format-Table Name, Length

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-test-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
