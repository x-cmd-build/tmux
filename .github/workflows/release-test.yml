name: release-test

# Multi-platform smoke test for published release artifacts.
#
# Distinct from build-and-test.yml (which verifies the BUILD on the
# build runner) and release.yml (which produces the artifacts).
# release-test downloads the SHIPPED artifacts from a GitHub Release
# and exercises them on each target platform — so a binary that
# builds cleanly but crashes on first run (e.g. dyld path issue,
# missing DLL on PATH) is caught here, before users hit it.
#
# Triggers:
#   - workflow_dispatch: manual; specify a tag (default: latest).
#   - release published: automatic; runs against the newly released tag.
#
# What it does per target:
#   1. Download the per-target archive + top-level SHA256SUMS via gh.
#   2. Verify SHA256 matches the entry in SHA256SUMS.
#   3. Extract the archive.
#   4. Run `tmux -V` — verifies the binary loads and reports the
#      version we vendored.
#   5. Run functional smoke: new-session + send-keys + capture-pane,
#      prove the client→server→pane pipeline works on this OS.
#   6. Report result to $GITHUB_STEP_SUMMARY.
#
# x86_64-macos is tested via `arch -x86_64` on a macos-latest
# (aarch64) runner — Rosetta 2 is pre-installed on GH Actions runners.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest)'
        required: false
        default: 'latest'
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.release.tag_name || 'latest' }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,  runner: ubuntu-latest,    os: linux,  arch: native }
          - { target: aarch64-linux-musl, runner: ubuntu-24.04-arm, os: linux,  arch: native }
          - { target: aarch64-macos,      runner: macos-latest,     os: macos,  arch: native }
          # x86_64-macos: tested via Rosetta 2 on a macos-latest
          # (aarch64) runner. Rosetta is pre-installed.
          - { target: x86_64-macos,       runner: macos-latest,     os: macos,  arch: x86_64 }
          # x86_64-windows: tested on windows-latest via msys2 bash.
          # tty-less smoke — version check + control-mode probe only.
          - { target: x86_64-windows,     runner: windows-latest,   os: windows, arch: native }
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${{ steps.tag.outputs.value }}"

      - name: Download release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cd dist
          gh release download "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern "tmux-${{ matrix.target }}.tar.xz" \
            --pattern "tmux-${{ matrix.target }}.zip" \
            --pattern "SHA256SUMS" \
            --dir .
          echo "==> dist contents:"
          ls -la
          echo "==> workspace scripts dir contents:"
          ls -la "$GITHUB_WORKSPACE/scripts/" 2>&1 | head -10 || echo "NO SCRIPTS DIR"

      - name: Verify SHA256SUMS entry
        shell: bash
        working-directory: dist
        run: |
          if [ -f "tmux-${{ matrix.target }}.tar.xz" ]; then
            ARCHIVE="tmux-${{ matrix.target }}.tar.xz"
          else
            ARCHIVE="tmux-${{ matrix.target }}.zip"
          fi
          EXPECTED=$(grep "  ${ARCHIVE}$" SHA256SUMS | awk '{print $1}')
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then
            echo "FAIL: $ARCHIVE not in SHA256SUMS" >&2
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: SHA256 mismatch for $ARCHIVE" >&2
            echo "  expected=$EXPECTED" >&2
            echo "  actual  =$ACTUAL" >&2
            exit 1
          fi
          echo "OK: SHA256 verified for $ARCHIVE"

      - name: Extract archive
        shell: bash
        working-directory: dist
        run: |
          if [ -f "tmux-${{ matrix.target }}.tar.xz" ]; then
            tar xJf "tmux-${{ matrix.target }}.tar.xz"
          else
            # Windows zip created by PowerShell's Compress-Archive
            # uses backslash path separators. unzip warns but extracts
            # in binary mode (-b).
            #
            # Also, this zip has NO top-level dir prefix (entries
            # are 'bin/', 'tmux.cmd', 'LICENSE' at the root).
            # The Linux/macOS tarball has a 'tmux-<target>/' prefix
            # — we normalize both to that layout here.
            # The zip has no top-level dir prefix and uses 'bin\'
            # (backslash) as a subdir name (PowerShell Compress-Archive
            # default). Use 'unzip -j' to junk paths and dispatch
            # each entry to its target dir explicitly. This avoids
            # the backslash-dir-name rabbit hole entirely.
            mkdir -p "tmux-${{ matrix.target }}/bin" "tmux-${{ matrix.target }}/man/man1"
            # Read the zip entry list. unzip -Z -1 prints paths
            # one per line. awk strips the metadata header.
            unzip -Z -1 "../tmux-${{ matrix.target }}.zip" 2>/dev/null > /tmp/zip-entries.txt || true
            if [ ! -s /tmp/zip-entries.txt ]; then
                unzip -l "../tmux-${{ matrix.target }}.zip" 2>/dev/null \
                  | awk '/^[[:space:]]+[0-9]/ {print $NF}' > /tmp/zip-entries.txt || true
            fi
            while IFS= read -r entry; do
                [ -z "$entry" ] && continue
                case "$entry" in
                    bin\*) target="tmux-${{ matrix.target }}/bin" ;;
                    man\man1\*) target="tmux-${{ matrix.target }}/man/man1" ;;
                    *) target="tmux-${{ matrix.target }}" ;;
                esac
                mkdir -p "$target"
                unzip -j -q -o "../tmux-${{ matrix.target }}.zip" "$entry" -d "$target" 2>/dev/null || true
            done < /tmp/zip-entries.txt
          fi
          ls -la "tmux-${{ matrix.target }}/bin/"

      - name: Smoke test
        shell: bash
        env:
          TMUX_ARCH: ${{ matrix.arch }}
          TMUX_OS: ${{ matrix.os }}
        run: |
          # arch wrapper for cross-arch macOS binaries.
          ARCH_BIN=""
          if [ "$TMUX_OS" = "macos" ] && [ "$TMUX_ARCH" = "x86_64" ]; then
            ARCH_BIN="arch -x86_64"
          fi

          BIN="dist/tmux-${{ matrix.target }}/bin/tmux"
          [ "$TMUX_OS" = "windows" ] && BIN="$BIN.exe"
          [ -f "$BIN" ] || BIN="dist/tmux-${{ matrix.target }}/bin/tmux.exe"

          echo "==> version banner"
          $ARCH_BIN "$BIN" -V

          if [ "$TMUX_OS" = "windows" ]; then
            # Windows smoke — verify v0.2.2+ wrapper works end-to-end.
            # The runner has Git Bash (windows-latest image includes
            # git-for-windows preinstalled), so the registry lookup
            # in tmux.cmd should succeed.
            #
            # v0.2.2+ requires the wrapper for runtime DLL resolution
            # (no bundled msys-2.0.dll). Verify:
            #   1. tmux.exe -V loads and reports vendored version
            #   2. tmux.cmd (zip root) is reachable
            #   3. tmux.cmd -V invokes tmux.exe via the wrapper
            #   4. tmux.cmd new-session -d starts a server (path-1 fix)
            #   5. tmux.cmd list-sessions / kill-server cleanup
            WRAPPER="dist/tmux-${{ matrix.target }}/tmux.cmd"
            if [ ! -f "$WRAPPER" ]; then
                echo "FAIL: $WRAPPER not found (v0.2.2+ requires wrapper at zip root)" >&2
                exit 1
            fi
            if [ ! -f "$BIN" ]; then
                echo "FAIL: $BIN not found" >&2
                exit 1
            fi
            if [ -f "dist/tmux-${{ matrix.target }}/bin/msys-2.0.dll" ]; then
                echo "FAIL: bundled msys-2.0.dll present (v0.2.2+ should NOT bundle it)" >&2
                exit 1
            fi

            echo "==> tmux.exe -V (direct)"
            "$BIN" -V
            BIN_VER=$("$BIN" -V | head -1)

            echo "==> tmux.cmd -V (via wrapper)"
            "$WRAPPER" -V
            WRAPPER_VER=$("$WRAPPER" -V | head -1)
            if [ "$BIN_VER" != "$WRAPPER_VER" ]; then
                echo "FAIL: wrapper version mismatch: direct='$BIN_VER' wrapper='$WRAPPER_VER'" >&2
                exit 1
            fi
            echo "OK: wrapper reports same version as direct invocation"

            echo "==> tmux.cmd -L win-smoke new-session -d"
            "$WRAPPER" -L win-smoke new-session -d
            WRAPPER_EXIT=$?
            if [ "$WRAPPER_EXIT" -ne 0 ]; then
                echo "FAIL: tmux.cmd new-session exited $WRAPPER_EXIT" >&2
                exit 1
            fi

            echo "==> tmux.cmd -L win-smoke list-sessions"
            LIST_OUT=$("$WRAPPER" -L win-smoke list-sessions 2>&1)
            echo "$LIST_OUT"
            case "$LIST_OUT" in
              *win-smoke*) echo "OK: wrapper successfully started server" ;;
              *) echo "FAIL: list-sessions did not return expected session" >&2; exit 1 ;;
            esac

            echo "==> tmux.cmd -L win-smoke kill-server"
            "$WRAPPER" -L win-smoke kill-server
            echo "OK: Windows smoke (v0.2.2 wrapper end-to-end)"
            exit 0
          fi

          # POSIX functional smoke: new-session + send-keys + capture-pane.
          SOCK="/tmp/release-test-smoke-$$"
          echo "==> functional smoke (new-session + send-keys + capture-pane)"
          $ARCH_BIN "$BIN" -S "$SOCK.sock" new-session -d -x 80 -y 24 -s smoke 'sleep 30' \
            || $ARCH_BIN "$BIN" -S "$SOCK.sock" new-session -d -x 80 -y 24 -s smoke 'sleep 30'
          $ARCH_BIN "$BIN" -S "$SOCK.sock" send-keys -t smoke 'echo release-test-ok' Enter
          sleep 1
          CAPTURED=$($ARCH_BIN "$BIN" -S "$SOCK.sock" capture-pane -p -t smoke 2>&1 | head -c 400)
          case "$CAPTURED" in
            *release-test-ok*)
              echo "OK: smoke captured 'release-test-ok' on pane"
              ;;
            *)
              echo "FAIL: smoke did NOT capture 'release-test-ok' — got: $CAPTURED" >&2
              exit 1
              ;;
          esac
          $ARCH_BIN "$BIN" -S "$SOCK.sock" kill-server 2>/dev/null || true
          rm -f "$SOCK.sock"
          echo "OK: smoke passed"

      - name: Report result
        if: always()
        run: |
          {
            echo "### release-test result for ${{ matrix.target }}"
            echo
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| tag | \`${{ steps.tag.outputs.value }}\` |"
            echo "| runner | \`${{ matrix.runner }}\` |"
            echo "| arch | \`${{ matrix.arch }}\` |"
            echo "| result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
