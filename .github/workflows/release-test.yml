name: release-test

# Multi-platform smoke test for published release artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest)'
        required: false
        default: 'latest'
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.release.tag_name || 'latest' }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,  runner: ubuntu-latest,    os: linux,  arch: native }
          - { target: aarch64-linux-musl, runner: ubuntu-24.04-arm, os: linux,  arch: native }
          - { target: aarch64-macos,      runner: macos-latest,     os: macos,  arch: native }
          - { target: x86_64-macos,       runner: macos-latest,     os: macos,  arch: x86_64 }
          - { target: x86_64-windows,     runner: windows-latest,   os: windows, arch: native }
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cd dist
          gh release download "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --pattern "tmux-${{ matrix.target }}.tar.xz" \
            --pattern "tmux-${{ matrix.target }}.zip" \
            --pattern "SHA256SUMS" \
            --dir .
          ls -la

      - name: Verify SHA256SUMS entry
        shell: bash
        working-directory: dist
        run: |
          if [ -f "tmux-${{ matrix.target }}.tar.xz" ]; then
            ARCHIVE="tmux-${{ matrix.target }}.tar.xz"
          else
            ARCHIVE="tmux-${{ matrix.target }}.zip"
          fi
          EXPECTED=$(grep "  ${ARCHIVE}$" SHA256SUMS | awk '{print $1}')
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then
            echo "FAIL: $ARCHIVE not in SHA256SUMS" >&2
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: SHA256 mismatch for $ARCHIVE" >&2
            exit 1
          fi
          echo "OK: SHA256 verified for $ARCHIVE"

      # Linux/macOS: tar.xz has a tmux-<target>/ prefix; tar extracts
      # cleanly. Windows: zip has no top-level prefix and uses backslash
      # paths from PowerShell Compress-Archive. We extract into a
      # PowerShell-managed temp dir on Windows, then use PowerShell's
      # Expand-Archive which handles backslash paths natively.
      - name: Extract archive (POSIX)
        if: matrix.os != 'windows'
        shell: bash
        working-directory: dist
        run: tar xJf "tmux-${{ matrix.target }}.tar.xz"

      - name: Extract archive (Windows)
        if: matrix.os == 'windows'
        shell: bash
        working-directory: dist
        run: |
          # Use Python's zipfile to extract. We use printf to write
          # the script (heredoc would conflict with YAML's '<<' merge
          # key syntax).
          rm -rf "tmux-${{ matrix.target }}"
          printf 'import sys, os, zipfile\nsrc, dst = sys.argv[1], sys.argv[2]\nos.makedirs(dst, exist_ok=True)\nwith zipfile.ZipFile(src) as z:\n    for name in z.namelist():\n        n = name.replace(chr(92), chr(47))\n        target = os.path.join(dst, n)\n        if name.endswith(chr(47)) or n.endswith(chr(47)):\n            os.makedirs(target, exist_ok=True)\n        else:\n            os.makedirs(os.path.dirname(target), exist_ok=True)\n            with z.open(name) as src_f, open(target, "wb") as dst_f:\n                dst_f.write(src_f.read())\n' > /tmp/extract_zip.py
          python /tmp/extract_zip.py "tmux-${{ matrix.target }}.zip" "tmux-${{ matrix.target }}"
          ls -la "tmux-${{ matrix.target }}/bin/"

      - name: Smoke test
        shell: bash
        env:
          TMUX_ARCH: ${{ matrix.arch }}
          TMUX_OS: ${{ matrix.os }}
        run: |
          ARCH_BIN=""
          if [ "$TMUX_OS" = "macos" ] && [ "$TMUX_ARCH" = "x86_64" ]; then
            ARCH_BIN="arch -x86_64"
          fi

          BIN="dist/tmux-${{ matrix.target }}/bin/tmux"
          [ "$TMUX_OS" = "windows" ] && BIN="$BIN.exe"
          [ -f "$BIN" ] || BIN="dist/tmux-${{ matrix.target }}/bin/tmux.exe"

          echo "==> version banner"
          $ARCH_BIN "$BIN" -V

          if [ "$TMUX_OS" = "windows" ]; then
            # v0.2.2+ requires the wrapper for runtime DLL resolution
            # (no bundled msys-2.0.dll).
            WRAPPER="dist/tmux-${{ matrix.target }}/tmux.cmd"
            [ ! -f "$WRAPPER" ] && { echo "FAIL: $WRAPPER not found" >&2; exit 1; }
            [ ! -f "$BIN" ] && { echo "FAIL: $BIN not found" >&2; exit 1; }
            [ -f "dist/tmux-${{ matrix.target }}/bin/msys-2.0.dll" ] && { echo "FAIL: bundled msys-2.0.dll present" >&2; exit 1; }

            BIN_VER=$("$BIN" -V | head -1)
            WRAPPER_VER=$("$WRAPPER" -V | head -1)
            [ "$BIN_VER" != "$WRAPPER_VER" ] && { echo "FAIL: wrapper version mismatch" >&2; exit 1; }
            echo "OK: wrapper version matches"

            "$WRAPPER" -L win-smoke new-session -d || { echo "FAIL: tmux.cmd new-session" >&2; exit 1; }
            LIST_OUT=$("$WRAPPER" list-sessions 2>&1)
            # tmux list-sessions output format: "<name>: N windows (created ...)"
            # Accept either '<name>: 1 windows' (any session) or
            # 'win-smoke: 1 windows' — both prove the wrapper started a server.
            case "$LIST_OUT" in
              *"1 windows"*) echo "OK: wrapper started server: $LIST_OUT" ;;
              *) echo "FAIL: list-sessions: $LIST_OUT" >&2; exit 1 ;;
            esac
            "$WRAPPER" -L win-smoke kill-server
            echo "OK: Windows smoke (v0.2.2 wrapper end-to-end)"
            exit 0
          fi

          # POSIX functional smoke
          SOCK="/tmp/release-test-smoke-$$"
          $ARCH_BIN "$BIN" -S "$SOCK.sock" new-session -d -x 80 -y 24 -s smoke 'sleep 30' \
            || $ARCH_BIN "$BIN" -S "$SOCK.sock" new-session -d -x 80 -y 24 -s smoke 'sleep 30'
          $ARCH_BIN "$BIN" -S "$SOCK.sock" send-keys -t smoke 'echo release-test-ok' Enter
          sleep 1
          CAPTURED=$($ARCH_BIN "$BIN" -S "$SOCK.sock" capture-pane -p -t smoke 2>&1 | head -c 400)
          case "$CAPTURED" in
            *release-test-ok*)
              echo "OK: smoke captured release-test-ok"
              $ARCH_BIN "$BIN" -S "$SOCK.sock" kill-server
              rm -f "$SOCK.sock"
              exit 0
              ;;
            *)
              echo "FAIL: smoke did NOT capture: $CAPTURED" >&2
              $ARCH_BIN "$BIN" -S "$SOCK.sock" kill-server 2>/dev/null || true
              rm -f "$SOCK.sock"
              exit 1
              ;;
          esac
