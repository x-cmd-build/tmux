name: build-and-test

# DISPATCH-ONLY build matrix. Triggered manually via
# `gh workflow run build-and-test` (or the web UI's "Run workflow"
# button). NO push / pull_request triggers — every CI run is explicit.
#
# 5 targets: 2 Linux musl + 2 macOS + 1 Windows.
# Builds, runs smoke, uploads artifacts. No release publish.
#
# Splits with `release.yml`:
#   - tag push / dispatch → release.yml (publish stage)
#
# Matrix mirrors the ljh-sh vendored-C dist regime: 4 fully-shipped
# targets (Linux musl x2 + macOS x2). Windows is DEFERRED to v0.2.0
# because tmux 3.7's configure.ac checks for CMSG_DATA in
# <sys/socket.h>, which MinGW's headers don't provide without a
# feature test macro; upstream tmux does not officially support
# Windows. See NOTICE.md §Windows support and mneme#N for the patch
# plan.
# DISPATCH-ONLY: no push, no pull_request triggers. CI is run explicitly
# via `gh workflow run build-and-test` (or the web UI's "Run workflow"
# button). Avoids burning minutes on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMP: Windows-only smoke (CI queue is backed up; reduce load)
          - { target: x86_64-windows,      runner: windows-latest,   os: windows                }
          # x86_64-linux-musl
          - { target: x86_64-linux-musl,   runner: ubuntu-latest,    os: linux,   libc: musl, docker_arch: amd64 }
          - { target: aarch64-linux-musl,  runner: ubuntu-24.04-arm, os: linux,   libc: musl, docker_arch: arm64 }
          - { target: aarch64-macos,       runner: macos-latest,     os: macos                  }
          # x86_64-macos: cross-compile from macos-latest via Rosetta
          # x86_64 Homebrew (/usr/local prefix). macos-13 (Intel)
          # runner was abandoned on 2026-08-06 due to multi-hour
          # queue wait. Cross-compile gives us the same result with
          # a working runner + x86_64 .a files under /usr/local.
          - { target: x86_64-macos,        runner: macos-latest,     os: macos, cross: x86_64 }
          # aarch64-windows: NOT in matrix — MSYS2 MINGW64 doesn't
          # ship mingw-w64-aarch64-gcc as of 2026-08-06 (same gap as
          # ljh-sh/fio + ljh-sh/iperf + ljh-sh/gawk).
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # ---- install deps ----
      - name: Install deps (Linux glibc — only used by shell-out helpers)
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Install deps (macOS — aarch64 native)
        if: matrix.os == 'macos' && matrix.cross != 'x86_64'
        run: |
          brew update
          brew install bash autoconf automake libtool pkg-config
          brew install libevent ncurses

      # x86_64-macos needs x86_64 .a files (Homebrew on Apple Silicon
      # ships arm64-only .a files, which break x86_64 cross-link).
      # Solution: install Rosetta 2 + a parallel x86_64 Homebrew
      # under /usr/local, then use `arch -x86_64 brew install`.
      # This gives us x86_64 .a files at /usr/local/opt/libevent/lib.
      - name: Install deps (macOS — x86_64 via Rosetta)
        if: matrix.cross == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license
          # Set up x86_64 Homebrew under /usr/local if not already.
          if ! command -v /usr/local/bin/brew >/dev/null 2>&1; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew update
          arch -x86_64 /usr/local/bin/brew install bash autoconf automake libtool pkg-config
          arch -x86_64 /usr/local/bin/brew install libevent ncurses

      # Windows x86_64: MSYS2 + msys gcc (option A from issue #1).
      # v0.2.0 pivot: build in MSYS shell, not MINGW64. tmux 3.7b
      # is deeply POSIX-dependent; msys gcc provides the full
      # POSIX header set, mingw-w64 doesn't.
      - name: Install deps (Windows MSYS2 + msys gcc + ncurses/libevent)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            git
            base-devel
            gcc
            autoconf
            automake
            libtool
            pkg-config
            make
            ncurses-devel
            libevent-devel

      # ---- build + smoke ----
      # Musl: a single Alpine `docker run` does build + smoke.
      # Alpine's apk brings build-base, bash, bison, libevent-dev +
      # ncurses-dev (static .a) — everything scripts/build-alpine.sh needs.
      - name: Build + smoke on Alpine (musl)
        if: matrix.libc == 'musl'
        run: docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD":/w -w /w alpine:3.20 sh -c 'apk add --no-cache bash >/dev/null && bash /w/scripts/build-alpine.sh && bash /w/scripts/smoke.sh'

      # macOS aarch64: native host build (with Homebrew libevent/ncurses
      # force-loaded via build.sh).
      - name: Build (macOS aarch64 — host)
        if: matrix.os == 'macos' && matrix.target == 'aarch64-macos'
        run: bash scripts/build.sh && bash scripts/smoke.sh

      # macOS x86_64: cross-compile from macos-latest (Apple Silicon)
      # using x86_64 Homebrew .a files under /usr/local.
      - name: Build (macOS x86_64 — cross from aarch64, Rosetta /usr/local .a)
        if: matrix.cross == 'x86_64'
        env:
          TMUX_TARGET_ARCH: x86_64
          TMUX_OS_HINT: darwin
          # Point force_load at the x86_64 .a files under /usr/local.
          # Override brew --prefix (which returns /opt/homebrew on
          # Apple Silicon) with explicit /usr/local paths.
          LIBEVENT_PREFIX: /usr/local/opt/libevent
          NCURSES_PREFIX:  /usr/local/opt/ncurses
        run: bash scripts/build.sh && bash scripts/smoke.sh

      # Windows x86_64: MSYS2 / msys gcc build. tmux 3.7b builds
      # cleanly with the MSYS2 PKGBUILD recipe (no patches; just
      # CPPFLAGS=-U_XOPEN_SOURCE -I/usr/include/ncursesw). The msys2
      # bash shell has no tty for pane rendering, so smoke is
      # informational only.
      - name: Build (Windows x86_64 — MSYS shell + msys gcc, PKGBUILD verbatim)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: bash scripts/build-msys2.sh && bash scripts/smoke-msys2.sh upstream/tmux/tmux.exe

      # ---- package ----
      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: TARGET=${{ matrix.target }} bash scripts/package.sh

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1

      # ---- verify self-contained ----
      - name: Verify self-contained (Linux)
        if: matrix.os == 'linux'
        run: |
          set -e
          bin="dist/tmux-${{ matrix.target }}/bin/tmux"
          out="$(ldd "$bin" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "not a dynamic executable" \
            || { echo "FAIL: not fully static"; exit 1; }

      - name: Verify self-contained (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          bin="dist/tmux-${{ matrix.target }}/bin/tmux"
          otool -L "$bin"
          otool -L "$bin" | grep -E '/(opt/homebrew|usr/local)/' \
            && { echo "FAIL: $bin links Homebrew dylibs"; exit 1; } || true
          echo "OK: only system libs (/usr/lib, /System/Library)"

      - name: Show file type & size (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          file dist/tmux-${{ matrix.target }}/bin/tmux
          du -h dist/tmux-${{ matrix.target }}.tar.xz

      - name: Show file type & size (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $exe = "dist/tmux-${{ matrix.target }}/bin/tmux.exe"
          file $exe
          Get-ChildItem "dist/tmux-${{ matrix.target }}.zip" | Format-Table Name, Length

      # ---- upload artifact (for human inspection; NOT a release) ----
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-test-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
