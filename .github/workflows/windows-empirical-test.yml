name: windows-empirical-test

# Empirical Windows tmux behavior validation.
#
# Why this workflow exists:
#   Discussions about Windows tmux behavior (DLL isolation, mount tables,
#   -S flag handling, wrapper design) have been speculative. This
#   workflow runs REAL scenarios on a real Windows runner with bash
#   (Git Bash) available, so design decisions are based on measured
#   data, not theory.
#
# Triggers: workflow_dispatch only (per dispatch-only CI policy).
# No push / pull_request triggers.
#
# What it does:
#   1. Detect Git Bash install on the runner.
#   2. Download v0.2.1's tmux-x86_64-windows.zip from GitHub Releases.
#   3. Run a battery of scenarios covering:
#      - Basic startup (sanity)
#      - new-session with TMPDIR set (mimics wrapper)
#      - tmux.cmd wrapper (current v0.2.1 design)
#      - -S with Windows path (expected to work)
#      - -S with HOME POSIX path (expected to FAIL with bundled DLL)
#      - Bundle DLL deleted + Git Bash on Win32 PATH (Option B hypothesis)
#      - -S with HOME POSIX path under Option B (expected to work)
#      - Basic new-session under Option B (sanity for Option B)
#   4. Aggregate pass/fail/skip to $GITHUB_STEP_SUMMARY.
#
# Dispatch: `gh workflow run windows-empirical-test`
#
# Iterate: each run reveals which hypotheses are wrong; adjust scenarios
# or designs based on what actually fails, not what theory predicts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Detect Git Bash on runner
        shell: pwsh
        run: |
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if ($bash) {
            # bash.exe is in <git_root>\usr\bin. Walk up two levels.
            $binDir = Split-Path $bash.Source -Parent
            $gitRoot = Split-Path $binDir -Parent
            $gitBin = "$gitRoot\usr\bin"
            "## Git Bash detected" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- bash: $($bash.Source)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "- git bin: $gitBin" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "GIT_BIN=$gitBin" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          } else {
            "## Git Bash NOT FOUND on runner" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Warning "Git Bash not found; scenarios that depend on it will SKIP"
          }

      - name: Download v0.2.1 zip
        shell: pwsh
        run: |
          $url = "https://github.com/x-cmd-build/tmux/releases/download/v0.2.1/tmux-x86_64-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "tmux.zip"
          Expand-Archive -Path "tmux.zip" -DestinationPath "tmux" -Force
          Write-Output "Extracted v0.2.1 zip:"
          Get-ChildItem "tmux" -Recurse | Select-Object FullName | Format-Table -HideTableHeaders

      - name: Run empirical test scenarios
        shell: bash
        run: bash scripts/windows-empirical-test.sh

      # === S11: v0.2.2 candidate wrapper from PowerShell context ===
      # This is the real-world test: user invokes wrapper via cmd.exe or
      # PowerShell (not bash). The wrapper must self-bootstrap by finding
      # Git Bash via registry, not relying on bash's pre-set PATH.
      - name: S11 - candidate wrapper from PowerShell
        shell: pwsh
        run: |
          $tmuxRoot = (Resolve-Path "tmux").Path
          # Use the zip-root copy of the candidate wrapper — the wrapper's
          # '%~dp0bin\tmux.exe' resolves relative to its own directory,
          # so the wrapper must live adjacent to bin/ to find tmux.exe.
          $candidateWrapper = Join-Path $tmuxRoot "tmux.cmd"

          # Remove bundled DLL so Win32 DLL search uses Git Bash's via PATH
          $dllBak = "$tmuxRoot\bin\msys-2.0.dll.bak"
          $dllOrig = "$tmuxRoot\bin\msys-2.0.dll"
          if (Test-Path $dllOrig) {
            Move-Item -Path $dllOrig -Destination $dllBak -Force
          }

          "## S11: candidate wrapper from PowerShell" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Output "## S11: candidate wrapper from PowerShell"

          try {
            # Test 1: -L label
            $out1 = & "$candidateWrapper" -L s11 new-session -d 2>&1
            $exit1 = $LASTEXITCODE
            "exit (new-session -L s11): $exit1" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Output "  S11 -L s11 new-session exit=$exit1 output: $($out1 -join ' | ')"
            if ($exit1 -eq 0) {
              $out1b = & "$candidateWrapper" -L s11 list-sessions 2>&1
              & "$candidateWrapper" -L s11 kill-server 2>&1 | Out-Null
              "## S11 PASS" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Write-Output "  S11 PASS"
            } else {
              "## S11 FAIL: new-session exited $exit1" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Write-Output "  S11 FAIL: exit=$exit1"
            }
          } catch {
            "## S11 EXCEPTION: $_" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Output "  S11 EXCEPTION: $_"
          }

          # Test 2: -S $HOME-style POSIX path
          $sockDir = "$env:USERPROFILE\.tmux-s11-test"
          $sock = "$sockDir\default"
          if (-not (Test-Path $sockDir)) { New-Item -ItemType Directory -Path $sockDir -Force | Out-Null }

          "## S11b: candidate wrapper -S POSIX path" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Output "## S11b: candidate wrapper -S POSIX path"
          try {
            # Convert $env:USERPROFILE to POSIX /c/... style
            $posixHome = "/c/" + ($env:USERPROFILE -replace '^C:\\', '') -replace '\\', '/'
            $posixSock = $posixHome + "/.tmux-s11-test/default"
            Write-Output "  POSIX socket path: $posixSock"
            $out2 = & "$candidateWrapper" -S "$posixSock" new-session -d 2>&1
            $exit2 = $LASTEXITCODE
            "exit (new-session -S POSIX): $exit2" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Output "  S11b -S POSIX new-session exit=$exit2 output: $($out2 -join ' | ')"
            if ($exit2 -eq 0) {
              & "$candidateWrapper" -S "$posixSock" list-sessions 2>&1 | Out-File -Append $env:GITHUB_STEP_SUMMARY
              & "$candidateWrapper" -S "$posixSock" kill-server 2>&1 | Out-Null
              "## S11b PASS" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Write-Output "  S11b PASS"
            } else {
              "## S11b FAIL: new-session exited $exit2" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Write-Output "  S11b FAIL: exit=$exit2"
            }
          } catch {
            "## S11b EXCEPTION: $_" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Output "  S11b EXCEPTION: $_"
          }

          Remove-Item -Recurse -Force $sockDir -ErrorAction SilentlyContinue

          # Restore bundled DLL
          if (Test-Path $dllBak) {
            Move-Item -Path $dllBak -Destination $dllOrig -Force
          }

          Get-Process tmux -ErrorAction SilentlyContinue | Stop-Process -Force